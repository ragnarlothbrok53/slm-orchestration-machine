[project]
name = "slom"
version = "0.1.1"
description = "Durable, tool-using agents for small language models, with a SQLite-journaled execution engine."
readme = "PYPI.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "agents", "durable-execution", "workflow", "sqlite", "tool-calling", "small-language-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "loguru>=0.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ragnarlothbrok53/slm-orchestration-machine"
Repository = "https://github.com/ragnarlothbrok53/slm-orchestration-machine"
Changelog = "https://github.com/ragnarlothbrok53/slm-orchestration-machine/blob/main/CHANGELOG.md"
Issues = "https://github.com/ragnarlothbrok53/slm-orchestration-machine/issues"

[project.scripts]
slom = "slom.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "psutil>=5.9",  # benchmarks: environment capture
    # Contract/integration tests run SLOM against the real inference server.
    "slim-serve==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests poll for state changes on purpose and query test servers with blocking calls.
"tests/*" = ["ASYNC110", "ASYNC210", "ASYNC251"]
"benchmarks/*" = ["ASYNC110", "ASYNC210", "ASYNC251"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
