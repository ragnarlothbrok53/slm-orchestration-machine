[project]
name = "slm-orchestration-framework"
version = "0.1.0"
description = "Durable, tool-using agents for small language models, with a SQLite-journaled execution engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "loguru>=0.7",
    "typer>=0.12",
]

[project.scripts]
sof = "sof.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    # Contract/integration tests run SOF against the real inference server.
    "slm-runtime @ git+https://github.com/ragnarlothbrok53/slm-inference-engine@v0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests poll for state changes on purpose and query test servers with blocking calls.
"tests/*" = ["ASYNC110", "ASYNC210", "ASYNC251"]
"benchmarks/*" = ["ASYNC110", "ASYNC210", "ASYNC251"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
